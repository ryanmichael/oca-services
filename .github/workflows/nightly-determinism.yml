name: Nightly determinism

# Runs the determinism harness against main on a daily cron. Hits each
# canonical (endpoint, date) N times in one server process and asserts
# byte-identical responses across reps. Catches in-process non-determinism
# (random IDs, Date.now() leakage, Map-iteration drift, etc.) that the
# existing baseline harness (`audit/snapshot.js`) cannot.
#
# Failure surface: opens / updates a GitHub Issue tagged "determinism-drift"
# so the failure is visible without anyone polling the Actions tab.

on:
  schedule:
    # 08:00 UTC daily — early enough to surface in morning standup, late
    # enough to clear any late-day staging activity.
    - cron: '0 8 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Boot dev server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/liturgy?date=2026-06-21 > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start; log:"
          cat server.log
          exit 1

      - name: Determinism check (3 reps × 42 endpoints)
        id: det
        run: npm run snapshot:determinism

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true

      - name: Upload drift artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-drift
          path: audit/reports/determinism-drift-*
          retention-days: 30

      - name: Open / update determinism-drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Nightly determinism harness reported drift on ${today}.`,
              ``,
              `Workflow run: ${run}`,
              `Drift detail artifact: \`determinism-drift\` (attached to the run).`,
              ``,
              `Drift means hitting the same (endpoint, date) twice in one server`,
              `process produced different responses. Investigate before merging`,
              `further changes — the bit-stable property the snapshot baseline`,
              `oracle relies on is silently broken.`,
              ``,
              `Common causes: \`Date.now()\` / \`new Date()\` leaking into output,`,
              `\`Math.random()\` calls, Map-iteration order in object spread,`,
              `un-pinned async race in cache priming.`,
            ].join('\n');

            // Look for an existing open issue with the label
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'determinism-drift', state: 'open',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
              console.log(`Commented on existing issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Determinism drift detected (${today})`,
                body,
                labels: ['determinism-drift'],
              });
              console.log(`Opened issue #${created.number}`);
            }
