name: Weekly LLM judge

# Runs the LLM judge against this weekend's services on Friday morning UTC,
# so any wording / commemoration / structural drift surfaces before parish
# Saturday prep.
#
#   findings  → (1) opens / updates the "llm-judge-findings" GitHub Issue
#               (2) launches Claude Code to prepare fixes AS A PULL REQUEST
#                   for human review (never merges, never pushes main/staging).
#
# Requires repo secret ANTHROPIC_API_KEY. Without it the workflow no-ops
# (the judge exits with a setup message instead of a real failure), and the
# auto-fix step is skipped.

on:
  schedule:
    # 12:00 UTC Friday — early in US Central morning, so findings land before
    # the Friday workday and well before Saturday-eve Vespers prep. That window
    # also leaves the auto-fix PR time to be reviewed before Saturday.
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      from:
        description: 'Compute weekend relative to this date (YYYY-MM-DD)'
        required: false
      autofix:
        description: 'Prepare an auto-fix PR when findings are present (true/false)'
        required: false
        default: 'true'

# contents:write + pull-requests:write let the auto-fix agent branch off main
# and open a PR. issues:write keeps the findings-issue heads-up. actions:read
# lets Claude read CI job logs if it needs them. NOTE: the agent is prompt-bound
# to PR-only — it must never push main/staging or self-merge. See the
# `Prepare auto-fix PR` step and .github/autofix/weekend-prompt.md.
#
# id-token:write is REQUIRED by anthropics/claude-code-action@v1 — it exchanges a
# GitHub OIDC token before it will run at all. It was missing from 2026-07-25
# (when the auto-fix step landed) until 2026-08-09, so EVERY scheduled auto-fix
# died with "Could not fetch an OIDC token" after three retries. The step carries
# continue-on-error, so the workflow still reported success and the auto-fix leg
# never once produced a pull request. Both sample workflows shipped by the Claude
# GitHub App (claude.yml, claude-code-review.yml) declare it; this hand-written
# one did not.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history so the auto-fix agent can branch + push cleanly.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Boot dev server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/liturgy?date=2026-06-21 > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start; log:"
          cat server.log
          exit 1

      - name: Run upcoming-weekend judge
        id: judge
        # Do not fail the job on findings — downstream steps branch on the step
        # outcome so both the issue heads-up AND the auto-fix PR can run.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not configured as a repo secret; skipping."
            exit 0
          fi
          if [ -n "${{ inputs.from }}" ]; then
            npm run audit:upcoming -- --from ${{ inputs.from }}
          else
            npm run audit:upcoming
          fi

      - name: Prepare auto-fix PR
        id: autofix
        # Only when the judge surfaced findings AND auto-fix is enabled
        # (workflow_dispatch can turn it off; scheduled runs default on).
        if: >
          steps.judge.outcome == 'failure' &&
          (github.event_name == 'schedule' || inputs.autofix != 'false')
        # A failed auto-fix (e.g. Claude GitHub App not installed) must not fail
        # the workflow or block the findings-issue heads-up below.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        env:
          # Explicit token for `gh` so Claude can open the PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are running headless in CI because the weekly LLM judge flagged
            findings for this weekend's services (Saturday Great Vespers + Sunday
            Divine Liturgy). Read the file `.github/autofix/weekend-prompt.md` in
            this repository and follow it EXACTLY — it is your complete task
            specification. The judge's findings are already written to
            `audit/reports/llm-judge-<date>-<service>.md` (dates are in the
            filenames). Prepare fixes as a PULL REQUEST for human review. Never
            merge, never push to main or staging. A dev server is already running
            on http://localhost:3000; restart it yourself after any DB or
            variable-sources/*.json edit.
          # NOTE: claude_args is a literal argument string handed to the CLI, not
          # YAML — a `#` line inside it is passed through as an argument, not
          # dropped as a comment. Keep all commentary out here.
          #
          # --max-turns was 60, and that was not enough for a nine-finding
          # weekend: the 2026-08-09 run burned all 60 turns and $5.02 on triage
          # plus the first fixes, then was killed with nothing pushed. The
          # durable half of that fix lives in weekend-prompt.md — the agent now
          # opens a draft PR BEFORE fixing anything, so a cutoff costs the
          # remaining fixes rather than the entire run. 120 buys room to finish a
          # normal week; budget roughly $0.08/turn.
          claude_args: |
            --model claude-opus-4-8
            --max-turns 120
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push origin main:*),Bash(git push --force:*)"

      # A broken auto-fix leg must be LOUD. `continue-on-error` above is
      # deliberate — a failed agent must not swallow the findings-issue heads-up
      # below — but for two weeks it also meant a completely dead auto-fix
      # reported as a green workflow. If the step was attempted and did not
      # succeed, say so in the log and mark the run unstable via the annotation.
      - name: Report auto-fix outcome
        if: always() && steps.autofix.outcome != '' && steps.autofix.outcome != 'skipped'
        run: |
          echo "auto-fix outcome: ${{ steps.autofix.outcome }}"
          if [ "${{ steps.autofix.outcome }}" != "success" ]; then
            echo "::warning title=Auto-fix PR step failed::The judge found things but the fix agent did not run to completion. Check for an OIDC/permissions error, a missing ANTHROPIC_API_KEY, or the Claude GitHub App being uninstalled. No pull request was prepared this week."
          fi

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

      - name: Upload judge reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-judge-reports
          path: audit/reports/llm-judge-*
          retention-days: 30
          if-no-files-found: ignore

      - name: Open / update llm-judge-findings issue
        # always() so the heads-up posts even if the auto-fix step above errored.
        if: always() && steps.judge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Weekly LLM judge surfaced findings on ${today}.`,
              ``,
              `Workflow run: ${run}`,
              `Reports artifact: \`llm-judge-reports\` (attached to the run).`,
              ``,
              `The judge compares this weekend's assembled Vespers + Liturgy`,
              `against the canonical OCA published DOCX. Findings cluster into`,
              `commemoration drift (wrong principal saint), structural issues`,
              `(wrong sticheron count, wrong Theotokion lookup), and translation`,
              `differences worth a glance before parish printout.`,
              ``,
              `🤖 An auto-fix PR (label \`auto-fix\`) may have been opened for this`,
              `weekend — check the open pull requests. It prepares data + structural`,
              `fixes with paired audit rules and pastes its own verification output.`,
              `**Promotion is a human decision — review before merging.** If no PR`,
              `appears, EITHER the agent judged every finding source-incomplete or a`,
              `false-positive (documented in the run), OR the auto-fix step itself`,
              `failed — the run carries a "Auto-fix PR step failed" warning when it`,
              `did. Do not read a missing PR as "nothing to fix" without checking`,
              `which of the two happened; between 2026-07-25 and 2026-08-09 it was`,
              `always the second.`,
              ``,
              `Address before Saturday Vespers if findings are high-severity;`,
              `medium / low can wait through the cycle.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'llm-judge-findings', state: 'open',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
              console.log(`Commented on existing issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `LLM judge findings (${today})`,
                body,
                labels: ['llm-judge-findings'],
              });
              console.log(`Opened issue #${created.number}`);
            }
