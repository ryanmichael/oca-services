name: Weekly LLM judge

# Runs the LLM judge against this weekend's services on Friday morning UTC,
# so any wording / commemoration / structural drift surfaces before parish
# Saturday prep.
#
#   findings  → opens / updates the "llm-judge-findings" GitHub Issue
#   no verdict → says so loudly and fails the run (see audit/llm-judge.js EXIT)
#
# This cron REPORTS. It does not fix.
#
# It used to also launch Claude Code to prepare an auto-fix pull request. That
# leg was removed on 2026-10-03: it was ~96% of the running cost (a weekend with
# findings cost ~$5.36 against ~$0.23 for the judge itself) and it had produced
# exactly one pull request in its lifetime — #4 on 2026-08-14, left as a draft.
# Judging is the part that earns its keep; drafting the fix is a human decision
# made with a human in the loop. The agent's task spec is kept, unwired, at
# .github/autofix/weekend-prompt.md if it is ever worth reviving.
#
# Requires repo secret ANTHROPIC_API_KEY. Without it the workflow no-ops
# (the judge exits with a setup message instead of a real failure).

on:
  schedule:
    # 12:00 UTC Friday — early in US Central morning, so findings land before
    # the Friday workday and well before Saturday-eve Vespers prep, leaving the
    # working day to triage anything it flags.
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      from:
        description: 'Compute weekend relative to this date (YYYY-MM-DD)'
        required: false

# The judge only reads the repo and writes the findings issue. Until
# 2026-10-03 this also carried contents:write, pull-requests:write and
# id-token:write for the auto-fix agent; with that leg removed, none of them are
# needed. (id-token:write was REQUIRED by anthropics/claude-code-action@v1 and
# its absence from 2026-07-25 to 2026-08-09 is why every scheduled auto-fix died
# with "Could not fetch an OIDC token" while still reporting success.)
permissions:
  contents: read
  issues: write

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history is no longer required (it existed so the auto-fix
          # agent could branch and push); kept because nothing depends on it
          # being shallow and the clone is small.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Boot dev server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/liturgy?date=2026-06-21 > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start; log:"
          cat server.log
          exit 1

      - name: Run upcoming-weekend judge
        id: judge
        # Never fails the job: downstream steps branch on the `status` output.
        #
        # `steps.judge.outcome` is deliberately NOT used any more. It collapses
        # every non-zero exit to 'failure', so on 2026-10-02 — when the Anthropic
        # credit balance ran out and both services returned API 400 — this step
        # read as 'failure', the findings issue announced findings that did not
        # exist, and the auto-fix agent was pointed at reports that were never
        # written. The run was green. See the EXIT table in audit/llm-judge.js.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not configured as a repo secret; skipping."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          if [ -n "${{ inputs.from }}" ]; then
            node scripts/audit-upcoming.js --from ${{ inputs.from }}
          else
            node scripts/audit-upcoming.js
          fi
          code=$?
          set -e
          echo "judge exit code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0)   echo "status=clean"    >> "$GITHUB_OUTPUT" ;;
            1|2) echo "status=findings" >> "$GITHUB_OUTPUT" ;;
            *)   echo "status=broken"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

      - name: Upload judge reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-judge-reports
          path: audit/reports/llm-judge-*
          retention-days: 30
          if-no-files-found: ignore

      - name: Open / update llm-judge-findings issue
        # always() so the heads-up still posts if an earlier step errored.
        if: always() && steps.judge.outputs.status == 'findings'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Weekly LLM judge surfaced findings on ${today}.`,
              ``,
              `Workflow run: ${run}`,
              `Reports artifact: \`llm-judge-reports\` (attached to the run).`,
              ``,
              `The judge compares this weekend's assembled Vespers + Liturgy`,
              `against the canonical OCA published DOCX. Findings cluster into`,
              `commemoration drift (wrong principal saint), structural issues`,
              `(wrong sticheron count, wrong Theotokion lookup), and translation`,
              `differences worth a glance before parish printout.`,
              ``,
              `This cron reports; it does not fix. Triage with the`,
              `\`audit-driven-fix\` skill, or \`choir-correction\` when the`,
              `difference turns out to be deliberate parish practice.`,
              ``,
              `Address before Saturday Vespers if findings are high-severity;`,
              `medium / low can wait through the cycle.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'llm-judge-findings', state: 'open',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
              console.log(`Commented on existing issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `LLM judge findings (${today})`,
                body,
                labels: ['llm-judge-findings'],
              });
              console.log(`Opened issue #${created.number}`);
            }

      # A judge that did not run must be LOUDER than a judge with findings, and
      # must never be mistaken for a clean weekend. On 2026-10-02 this condition
      # existed in neither form: the run reported success while nothing had been
      # judged at all.
      - name: Report a judge that produced no verdict
        if: always() && steps.judge.outputs.status == 'broken'
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const code  = '${{ steps.judge.outputs.code }}';
            const body = [
              `⚠️ The weekly LLM judge **did not run** on ${today} (exit ${code}).`,
              ``,
              `Workflow run: ${run}`,
              ``,
              `**This weekend was not judged.** It is neither clean nor flagged —`,
              `no verdict exists for either service, so treat the weekend as`,
              `unreviewed and fall back to \`npm run audit:date\` plus the choir`,
              `packet review before parish printout.`,
              ``,
              `Usual causes, most common first:`,
              `- the Anthropic credit balance is empty (the 2026-10-02 case — the`,
              `  judge logged \`API 400 ... "Your credit balance is too low"\`)`,
              `- \`ANTHROPIC_API_KEY\` missing, expired or rotated`,
              `- the dev server never came up, so the judge could not fetch the`,
              `  assembled service (connection refused)`,
              ``,
              `No findings issue was opened, which is correct: there is no`,
              `verdict to report either way.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'llm-judge-findings', state: 'open',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `LLM judge did not run (${today})`,
                body,
                labels: ['llm-judge-findings'],
              });
            }

      # Last step, so the steps above still post. Red run = nothing was judged.
      - name: Fail the run when nothing was judged
        if: always() && steps.judge.outputs.status == 'broken'
        run: |
          echo "::error title=LLM judge produced no verdict::The judge exited ${{ steps.judge.outputs.code }} — this weekend was NOT judged. Not clean, not flagged. Check the Anthropic credit balance and ANTHROPIC_API_KEY."
          exit 1
