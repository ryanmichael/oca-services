name: Nightly translation matrix

# Sweeps the full {listed-overlay × canonical-date × core-endpoint} matrix
# against main on a daily cron. Catches regressions a single-overlay PR
# check wouldn't surface: manifest typos, broken extends chains, key
# references that throw on specific dates, route-level errors that only
# appear with a specific overlay applied.
#
# Companion to nightly-determinism.yml. Different concern → separate
# workflow → cleaner alert routing.

on:
  schedule:
    # 08:15 UTC daily — 15 minutes after the determinism cron so the two
    # don't fight for the runner queue when both happen to be slow.
    - cron: '15 8 * * *'
  workflow_dispatch:  # allow manual runs

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Boot dev server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/liturgy?date=2026-06-21 > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start; log:"
          cat server.log
          exit 1

      - name: Capture boot-time drift warnings
        run: |
          # Boot warnings about overlay keys not in base land on stderr at
          # startup. Surface them in the workflow log so reviewers can see
          # any silent drift without needing to dig.
          grep -i "silent drift\|drift" server.log || echo "(no overlay-drift warnings on boot)"

      - name: Translation matrix sweep
        run: npm run translation-matrix

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true

      - name: Upload failures artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: translation-matrix-failures
          path: |
            audit/reports/translation-matrix-failures.json
            server.log
          retention-days: 30

      - name: Open / update translation-matrix-failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Nightly translation matrix reported failures on ${today}.`,
              ``,
              `Workflow run: ${run}`,
              `Failure detail artifact: \`translation-matrix-failures\` (attached to the run).`,
              ``,
              `One or more (overlay, date, endpoint) cells failed to return 200.`,
              `Most likely causes:`,
              `- An overlay manifest typo (check the \`extends\` chain)`,
              `- A new fixed-text key not present in the base / a parent overlay`,
              `- An overlay that references a key removed from the base`,
              `- A route-level error that only surfaces with this overlay applied`,
              ``,
              `Open the artifact JSON for the exact failing cells.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'translation-matrix-failure', state: 'open',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
              console.log(`Commented on existing issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Translation matrix failure (${today})`,
                body,
                labels: ['translation-matrix-failure'],
              });
              console.log(`Opened issue #${created.number}`);
            }
