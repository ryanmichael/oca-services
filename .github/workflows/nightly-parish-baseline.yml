name: Nightly parish-selection baseline

# Diffs our assembled Vespers selection (principal saint / sticheron count) for
# every dated ocanwa parish manifest under audit/ocanwa-baseline/ against the
# committed baseline (audit/parish-baseline.json). Like the rescrape cron, it
# alerts ONLY on divergences that are NEW relative to the baseline — the ~14
# known rank/coverage findings stay quiet.
#
# What a NEW finding means: our assembler started picking a different principal
# (a picker/calendar change — intended or a regression), or a new month manifest
# was added without refreshing the baseline. The parish files themselves are
# effectively static, so this watches OUR side for drift.
#
# Unlike the serverless rescrape harness, this one needs /api/service, so it
# boots the server first. Failure surface: opens / updates a GitHub Issue
# tagged "parish-baseline-drift".

on:
  schedule:
    # 08:45 UTC daily — after determinism (08:00), translation-matrix (08:15),
    # and rescrape (08:30) so the nightly crons don't contend for the runner.
    - cron: '45 8 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

jobs:
  parish-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Boot server
        run: |
          PORT=3000 node server.js > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for /api/service to answer (max ~30s).
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:3000/api/service?date=2026-07-05&format=json" >/dev/null; then
              echo "server up after ${i}s"; break
            fi
            sleep 1
          done

      - name: Parish-selection baseline check vs baseline
        run: |
          set -o pipefail
          node scripts/ocanwa-baseline.js --check audit/parish-baseline.json | tee parish-baseline-check.log

      - name: Stop server
        if: always()
        run: kill "${SERVER_PID}" 2>/dev/null || true

      - name: Upload check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parish-baseline-drift
          path: parish-baseline-check.log
          retention-days: 30

      - name: Open / update parish-baseline-drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            let detail = '';
            try {
              const log = fs.readFileSync('parish-baseline-check.log', 'utf8');
              const idx = log.indexOf('NEW divergences');
              detail = idx >= 0 ? log.slice(idx) : log;
            } catch { detail = '(check log unavailable — see the uploaded artifact)'; }
            const body = [
              `Nightly parish-selection baseline found a divergence NEW relative to`,
              `\`audit/parish-baseline.json\` on ${today}.`,
              ``,
              `Workflow run: ${run}`,
              ``,
              `Each key is \`<MMDD>:<parish-principal-tokens>:<class>\` where class is`,
              `\`rank\` (the parish's saint is one of our commemorations but not our`,
              `principal) or \`unresolved\` (maps to none of our day commemorations).`,
              `A NEW key means our assembler's pick changed since the baseline, or a`,
              `month manifest was added without refreshing it.`,
              ``,
              '```',
              detail.trim().slice(0, 8000),
              '```',
              ``,
              `Triage with the \`audit-driven-fix\` skill. If a NEW finding reflects an`,
              `intended pick change (or a newly added month), refresh the baseline:`,
              `\`node scripts/ocanwa-baseline.js --capture-baseline audit/parish-baseline.json\``,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'parish-baseline-drift', state: 'open',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body,
              });
              console.log(`Commented on existing issue #${issues[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Parish-selection baseline drift (${today})`,
                body,
                labels: ['parish-baseline-drift'],
              });
              console.log(`Opened issue #${created.number}`);
            }
