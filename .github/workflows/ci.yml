name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Need 24+ so `node:sqlite` is available unflagged. (Added in 22.5
          # behind --experimental-sqlite; flag lifted in 24.)
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Smoke tests
        run: npm test

      - name: Contract regression tests
        run: npm run test:contracts

      - name: Structural audit (calendar geometry, no server)
        run: npm run audit:quick

      - name: Contract-check (strict — flag any code surface change missing spec/test updates)
        run: node scripts/contract-check.js --strict --base origin/${{ github.base_ref || github.ref_name }}
        continue-on-error: true

  audit-sweep:
    # Full representative-sample audit across Vespers + Liturgy + Matins +
    # Presanctified + Holy Week services. Boots the server so rules that
    # need assembled output can fetch it. Fails on any new high-severity
    # finding not allow-listed in audit/known-issues.json (--strict).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Boot dev server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/liturgy?date=2026-06-21 > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start; log:"
          cat server.log
          exit 1

      - name: Representative-sample audit (strict)
        id: audit
        # Strict gate: any new high-severity finding not allow-listed in
        # audit/known-issues.json fails the job. Backlog of 82 pre-existing
        # findings (D2-D6, E4, L3) triaged into known-issues.json on
        # 2026-06-18 — see those entries' `reason` fields for the underlying
        # fix paths. Today's representative sweep: 0 high / 0 medium / 0 low,
        # 35 suppressed (after D4 Sat-eve aposticha-theotokion re-key on 2026-06-19).
        run: npm run audit -- --strict
        continue-on-error: true

      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit/reports/latest.*
          retention-days: 30

      - name: Post audit summary to PR
        # On pull-requests, post (or update) a sticky comment summarizing the
        # audit run. Surfaces totals + first 10 high-severity findings inline
        # without requiring reviewers to click through to the artifact. The
        # comment is updated in place on subsequent runs of the same PR.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try { report = JSON.parse(fs.readFileSync('audit/reports/latest.json', 'utf8')); }
            catch (_) { console.log('No audit report to post.'); return; }

            const { stats = {}, scope = {}, findings = [] } = report;
            const high = stats.high || 0;
            const med  = stats.medium || 0;
            const low  = stats.low || 0;
            const sup  = stats.suppressed || 0;
            const status = high > 0 ? '❌ FAIL' : '✅ PASS';

            const topFindings = findings.slice(0, 10).map(f =>
              `- **[${f.severity}]** ${f.date} \`${f.service}\` ${f.rule} — ${f.message}`
            ).join('\n');

            const body = [
              `<!-- audit-sweep-comment -->`,
              `## Audit sweep ${status}`,
              ``,
              `**Scope:** ${scope.dates || '?'} dates × ${scope.services || '?'} services × ${scope.rules || '?'} rules`,
              `**Findings:** ${high} high · ${med} medium · ${low} low · ${sup} suppressed`,
              ``,
              high > 0 ? `### Top findings\n${topFindings || '(none)'}` : '',
              `\n[Full report attached as artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith('<!-- audit-sweep-comment -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body,
              });
            }

      - name: Fail job on audit findings
        # Post-comment gate so the PR comment lands even when the audit fails.
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Audit reported high-severity findings; failing the job."
          exit 1
